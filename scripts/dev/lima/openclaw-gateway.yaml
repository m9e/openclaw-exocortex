minimumLimaVersion: "2.0.0"

# No default mounts: the host home must never be readable from the agent VM.
# start-openclaw-vms.sh supplies an explicit narrow mount set at creation
# (repo r/o, workspace deps r/o, runtime metadata r/o, agent workspace r/w).
base:
  - template:_images/ubuntu

vmType: vz
arch: aarch64
cpus: 6
memory: "12GiB"
disk: "80GiB"
mountType: virtiofs

containerd:
  system: false
  user: false

hostResolver:
  enabled: true

networks:
  - vzNAT: true

env:
  OPENCLAW_VM_ROLE: gateway

message: |
  openclaw-gateway is a trusted Lima VM for the OpenClaw gateway and trusted tools.
  Guest localhost ports are not auto-forwarded; only start-openclaw-vms.sh
  configured host forwards are enabled. Gateway forwards are host-loopback only.
  Do not expose the trusted Gateway WebSocket to sibling Lima guests or the host LAN.
  Gateway Pipelock is forwarded to a runtime-specific host port for the
  untrusted VM only; the host PF anchor blocks other sources from that forward.

portForwards:
  - guestPort: 18789
    hostIP: "127.0.0.1"
    hostPort: 29789
  - guestPort: 18790
    hostIP: "127.0.0.1"
    hostPort: 29790
  - guestPort: 8888
    guestIP: "0.0.0.0"
    guestIPMustBeZero: false
    hostIP: "0.0.0.0"
    hostPort: 29888
    proto: tcp
  - guestIP: "127.0.0.1"
    guestPortRange: [1, 65535]
    hostIP: "127.0.0.1"
    hostPortRange: [1, 65535]
    proto: any
    ignore: true
