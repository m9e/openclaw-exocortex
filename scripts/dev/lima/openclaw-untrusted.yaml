minimumLimaVersion: "2.0.0"

base:
  - template:_images/ubuntu

vmType: vz
arch: aarch64
cpus: 4
memory: "8GiB"
disk: "60GiB"

containerd:
  system: false
  user: false

hostResolver:
  enabled: true

networks:
  - vzNAT: true

env:
  OPENCLAW_VM_ROLE: untrusted

message: |
  openclaw-untrusted is an isolated Lima VM for untrusted content and tool execution.
  No host directories are mounted into this guest.
  Guest localhost ports are not auto-forwarded; only start-openclaw-vms.sh
  configured host-loopback forwards are enabled.

portForwards:
  - guestPort: 18789
    hostIP: "127.0.0.1"
    hostPort: 39789
  - guestPort: 18790
    hostIP: "127.0.0.1"
    hostPort: 39790
  - guestIP: "127.0.0.1"
    guestPortRange: [1, 65535]
    hostIP: "127.0.0.1"
    hostPortRange: [1, 65535]
    proto: any
    ignore: true
